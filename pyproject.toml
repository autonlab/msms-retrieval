[project]
name = "sna"
version = "0.1.0"
description = "Separability Is Not Alignability: spectrum-to-molecule retrieval experiments"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
dependencies = ["torch==2.13.0", "numpy==2.5.1", "pandas==3.0.5", "rdkit==2026.3.4", "transformers==5.14.1", "tensorboard==2.21.0", "huggingface-hub==1.26.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sna", "sna.encoders"]

[project.scripts]
sna = "sna.cli:main"
